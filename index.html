<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pin na 3D modelu</title>

    <!-- OQSE Application Manifest -->
    <script type="application/oqse-manifest+json">
    {
        "version": "1.0",
        "id": "https://memizy.com/plugins/pin-on-3d-model",
        "appName": "Pin na 3D modelu",
        "capabilities": {
            "actions": ["quiz"],
            "types": ["pin-on-model"]
        }
    }
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #1a2535; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #eee; user-select: none; }

        /* ─── NAČÍTÁNÍ ─── */
        #loading {
            position: absolute; inset: 0;
            background: #1a2535;
            display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 150; gap: 16px; font-size: 1.3rem; color: #ccc;
        }
        #loading.hidden { display: none; }
        .loader {
            width: 52px; height: 52px;
            border: 6px solid #344658; border-top-color: #3498db;
            border-radius: 50%; animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── HLAVNÍ APP ─── */
        #app { position: absolute; inset: 0; display: none; }
        #app.active { display: block; }
        #canvas-wrap { position: absolute; inset: 0; }
        canvas { display: block; width: 100%; height: 100%; }

        /* ─── QUIZ OVERLAY ─── */
        #quiz-ui {
            position: absolute; bottom: 0; left: 0; right: 0;
            pointer-events: none;
            z-index: 20;
        }
        #quiz-card {
            background: rgba(12, 20, 30, 0.96);
            border: 1px solid #2c3e50;
            border-radius: 12px 12px 0 0;
            padding: 16px 22px 14px;
            pointer-events: auto;
            backdrop-filter: blur(6px);
        }
        #quiz-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
        #quiz-progress-wrap { flex: 1; height: 5px; background: #2c3e50; border-radius: 3px; overflow: hidden; }
        #quiz-progress-bar { height: 100%; background: #3498db; transition: width 0.4s ease; }
        #quiz-score-label { font-size: 0.8rem; color: #7fb3d3; white-space: nowrap; }
        #quiz-question { font-size: 1.05rem; color: #eee; font-weight: 600; line-height: 1.5; margin-bottom: 8px; }
        #quiz-question b { color: #f1c40f; }
        #quiz-instruction { font-size: 0.82rem; color: #5dade2; margin-bottom: 9px; }
        #quiz-explanation {
            display: none;
            background: rgba(46, 204, 113, 0.12);
            border-left: 3px solid #2ecc71;
            padding: 8px 12px; border-radius: 0 6px 6px 0;
            font-size: 0.83rem; color: #ccc; line-height: 1.5; margin-bottom: 10px;
        }
        #quiz-explanation.wrong { background: rgba(231, 76, 60, 0.12); border-left-color: #e74c3c; }
        #quiz-next-btn {
            display: none;
            background: #f39c12; border: none; color: #1a2535;
            padding: 8px 22px; border-radius: 7px; cursor: pointer;
            font-size: 0.92rem; font-weight: 700; float: right;
            min-width: 44px; min-height: 44px;
        }
        #quiz-next-btn:hover { background: #f1c40f; }
        .quiz-clearfix { clear: both; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<!-- NAČÍTÁNÍ -->
<div id="loading">
    <div class="loader"></div>
    <div id="loading-text">Inicializuji…</div>
</div>

<!-- HLAVNÍ APP -->
<div id="app">
    <div id="canvas-wrap">
        <!-- Quiz overlay -->
        <div id="quiz-ui">
            <div id="quiz-card">
                <div id="quiz-progress">
                    <div id="quiz-progress-wrap"><div id="quiz-progress-bar" style="width:0%"></div></div>
                    <span id="quiz-score-label">1 / ? &nbsp;|&nbsp; ✓ 0</span>
                </div>
                <div id="quiz-question"></div>
                <div id="quiz-instruction">👆 Klikni na správnou část modelu</div>
                <div id="quiz-explanation"></div>
                <button id="quiz-next-btn">Další →</button>
                <div class="quiz-clearfix"></div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
    import { MemizyPlugin }  from 'https://cdn.jsdelivr.net/npm/@memizy/plugin-sdk/+esm';

    // ─── SDK INIT ─────────────────────────────────────────────────────────────
    const plugin = new MemizyPlugin({
        id: 'https://memizy.com/plugins/pin-on-3d-model',
        version: '1.0.0',
    });

    // ─── MOCK DATA pro standalone dev (načte data.oqse.json lokálně) ─────────
    fetch('data.oqse.json')
        .then(r => r.json())
        .then(oqse => {
            const items = oqse.items
                .filter(i => i.type === 'pin-on-model')
                .map(i => {
                    const assetDef = oqse.meta?.assets?.[i.targetAsset];
                    // _assetUrl je extra pole – v reálném hostu by bylo součástí itemu
                    return { ...i, _assetUrl: assetDef?.value ?? i.targetAsset };
                });
            plugin.useMockData(items, { locale: 'cs', theme: 'dark' });
        })
        .catch(() => {
            plugin.useMockData([], { locale: 'cs', theme: 'dark' });
        });

    // ─── THREE.JS SETUP ───────────────────────────────────────────────────────
    const canvasWrap = document.getElementById('canvas-wrap');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a2535);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 1000);
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.shadowMap.enabled = true;
    renderer.setPixelRatio(window.devicePixelRatio);
    canvasWrap.appendChild(renderer.domElement);

    // Světla
    scene.add(new THREE.AmbientLight(0xffffff, 1.8));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(5, 10, 5); sun.castShadow = true;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x8899bb, 0.8);
    fill.position.set(-5, -2, -5);
    scene.add(fill);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Resize observer – canvas se přizpůsobí containeru
    const ro = new ResizeObserver(() => {
        const w = canvasWrap.clientWidth, h = canvasWrap.clientHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    });
    ro.observe(canvasWrap);

    // Render loop
    (function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    })();

    // ─── STAV ─────────────────────────────────────────────────────────────────
    let loadedModel  = null;
    let allMeshes    = [];
    let hoveredMesh  = null;
    let quizItems    = [];
    let quizIndex    = 0;
    let quizScore    = 0;
    let quizAnswered = false;
    let sessionStart = 0;
    let isAborted    = false;

    // ─── MATERIAL HELPERS ─────────────────────────────────────────────────────
    function makeCorrectFeedbackMat(mesh) {
        const mat = mesh.userData.originalMat.clone();
        mat.emissive = new THREE.Color(0x00cc44);
        mat.emissiveIntensity = 1.5;
        return mat;
    }
    function makeWrongFeedbackMat(mesh) {
        const mat = mesh.userData.originalMat.clone();
        mat.emissive = new THREE.Color(0xdd1111);
        mat.emissiveIntensity = 1.5;
        return mat;
    }
    function renderMd(str) {
        return str.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    }
    function resetAllToOriginal() {
        allMeshes.forEach(m => { if (m.userData.originalMat) m.material = m.userData.originalMat; });
        hoveredMesh = null;
    }

    // ─── LOAD MODEL ───────────────────────────────────────────────────────────
    const loader = new GLTFLoader();
    const draco  = new DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
    loader.setDRACOLoader(draco);

    function loadModel(filename, onLoaded) {
        if (loadedModel) { scene.remove(loadedModel); loadedModel = null; allMeshes = []; }

        loader.load(filename, (gltf) => {
            if (isAborted) return;
            loadedModel = gltf.scene;

            // Vycentrování + normalizace scale
            const box    = new THREE.Box3().setFromObject(loadedModel);
            const center = box.getCenter(new THREE.Vector3());
            const size   = box.getSize(new THREE.Vector3());
            const scale  = 2.2 / Math.max(size.x, size.y, size.z);
            loadedModel.scale.setScalar(scale);
            loadedModel.position.copy(center.multiplyScalar(-scale));

            // Reset kamery
            controls.target.set(0, 0, 0);
            camera.position.set(0, 0.5, 3);
            controls.update();

            // Projít meshe – zachovat originální materiály z GLB
            allMeshes = [];
            loadedModel.traverse(child => {
                if (!child.isMesh) return;
                allMeshes.push(child);
                child.userData.originalMat = child.material;
                child.castShadow = true;
                child.receiveShadow = true;
            });

            scene.add(loadedModel);
            if (onLoaded) onLoaded();

        }, undefined, (err) => {
            console.error(err);
            plugin.reportError('MODEL_LOAD_FAILED', err.message, { itemId: null, context: { filename } });
            document.getElementById('loading-text').textContent = '❌ Chyba načítání modelu';
        });
    }

    // ─── RAYCASTING ──────────────────────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const mouseVec  = new THREE.Vector2();

    canvasWrap.addEventListener('mousemove', (e) => {
        const rect = canvasWrap.getBoundingClientRect();
        mouseVec.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
        mouseVec.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
    });

    canvasWrap.addEventListener('click', () => {
        if (!loadedModel || quizAnswered || isAborted) return;
        raycaster.setFromCamera(mouseVec, camera);
        const hits = raycaster.intersectObjects(loadedModel.children, true).filter(h => h.object.isMesh);
        if (hits.length > 0) handleQuizClick(hits[0].object);
    });

    // ─── QUIZ LOGIKA ──────────────────────────────────────────────────────────
    function showQuizQuestion(idx) {
        if (isAborted) return;
        if (idx >= quizItems.length) { finishSession(); return; }

        const item   = quizItems[idx];
        quizAnswered = false;
        resetAllToOriginal();

        document.getElementById('quiz-question').innerHTML        = renderMd(item.question);
        document.getElementById('quiz-instruction').style.display = '';
        document.getElementById('quiz-instruction').textContent   = '👆 Klikni na správnou část modelu';
        document.getElementById('quiz-explanation').style.display = 'none';
        document.getElementById('quiz-explanation').className     = '';
        document.getElementById('quiz-next-btn').style.display    = 'none';

        const pct = (idx / quizItems.length) * 100;
        document.getElementById('quiz-progress-bar').style.width = pct + '%';
        document.getElementById('quiz-score-label').textContent  =
            `${idx + 1} / ${quizItems.length}  \u2502  ✓ ${quizScore}`;

        plugin.startItemTimer(item.id);
    }

    function handleQuizClick(mesh) {
        if (quizAnswered || isAborted) return;
        quizAnswered = true;

        const item      = quizItems[quizIndex];
        const targets   = item.hotspots
            .filter(h => h.type === 'mesh')
            .map(h => h.targetName.toLowerCase());
        const isCorrect = targets.includes(mesh.name.toLowerCase());

        if (isCorrect) {
            quizScore++;
            mesh.material = makeCorrectFeedbackMat(mesh);
        } else {
            mesh.material = makeWrongFeedbackMat(mesh);
            allMeshes.forEach(m => {
                if (targets.includes(m.name.toLowerCase())) m.material = makeCorrectFeedbackMat(m);
            });
        }

        // --- SDK: nahlásit odpověď ---
        plugin
            .answer(item.id, isCorrect, { answer: mesh.name })
            .updateProgress(quizIndex + 1, quizItems.length);

        const expBox = document.getElementById('quiz-explanation');
        expBox.innerHTML     = (isCorrect ? '✅ ' : '❌ Správně: kost je zvýrazněna zeleně. ') + (item.explanation || '');
        expBox.className     = isCorrect ? '' : 'wrong';
        expBox.style.display = 'block';
        document.getElementById('quiz-instruction').style.display = 'none';
        document.getElementById('quiz-next-btn').style.display    = 'inline-block';
        document.getElementById('quiz-score-label').textContent   =
            `${quizIndex + 1} / ${quizItems.length}  \u2502  ✓ ${quizScore}`;
    }

    document.getElementById('quiz-next-btn').addEventListener('click', () => {
        quizIndex++;
        showQuizQuestion(quizIndex);
    });

    function finishSession() {
        if (isAborted) return;
        document.getElementById('quiz-ui').style.display = 'none';
        resetAllToOriginal();

        const pct         = Math.round((quizScore / quizItems.length) * 100);
        const totalSpent  = Date.now() - sessionStart;

        // Zobrazit výsledkový overlay
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;';
        overlay.innerHTML = `
            <div style="font-size:3.5rem;">🏆</div>
            <div style="font-size:1.8rem;font-weight:700;color:#f1c40f;">Kvíz dokončen!</div>
            <div style="font-size:1.15rem;color:#eee;">Skóre: <strong style="color:#2ecc71">${quizScore}</strong> z ${quizItems.length} &nbsp;(${pct}&nbsp;%)</div>`;
        document.getElementById('canvas-wrap').appendChild(overlay);

        // --- SDK: signalizovat dokončení ---
        plugin.complete({ score: pct, totalTimeSpent: totalSpent });
    }

    // ─── SDK CALLBACKS ────────────────────────────────────────────────────────
    plugin
        .onInit(({ items }) => {
            const pinItems = items.filter(i => i.type === 'pin-on-model');

            if (!pinItems.length) {
                plugin.reportError('NO_ITEMS', 'Žádné pin-on-model položky', { itemId: null, context: null });
                plugin.complete({ score: null, totalTimeSpent: 0 });
                return;
            }

            quizItems    = pinItems;
            quizIndex    = 0;
            quizScore    = 0;
            sessionStart = Date.now();

            // _assetUrl pochází z mock dat; v reálném hostu by byl targetAsset přímá URL
            const modelUrl = pinItems[0]._assetUrl ?? pinItems[0].targetAsset;

            document.getElementById('loading-text').textContent = 'Načítám model…';

            loadModel(modelUrl, () => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('app').classList.add('active');
                showQuizQuestion(0);
            });
        })
        .onAborted(() => {
            isAborted = true;
            // Zastavit všechny časovače a skrýt UI
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('quiz-ui').style.display = 'none';
        })
        .onResumed(() => {
            isAborted = false;
        })
        .onConfigUpdate(({ theme }) => {
            if (theme === 'light') {
                scene.background = new THREE.Color(0xf0f4f8);
                document.body.style.background = '#f0f4f8';
            } else {
                scene.background = new THREE.Color(0x1a2535);
                document.body.style.background = '#1a2535';
            }
        });

</script>
</body>
</html>
